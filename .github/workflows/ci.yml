name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download official Matsuyama open data and build analysis payload
        run: python scripts/update_data.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Analysis QA
        run: python scripts/qa.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax check
        run: node --check assets/app.js

      - name: Verify deployable files
        run: |
          test -s index.html
          test -s assets/app.js
          test -s assets/styles.css
          test -s data/processed.json
