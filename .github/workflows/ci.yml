name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build 100m population × OSM walking-network payload
        run: python scripts/update_data.py

      - name: Unit and data-contract tests
        run: python -m unittest discover -s tests -v

      - name: Analysis QA
        run: python scripts/qa.py | tee qa.log

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax check
        run: node --check assets/app.js

      - name: Verify deployable files
        run: |
          test -s index.html
          test -s assets/app.js
          test -s assets/styles.css
          test -s data/processed.json

      - name: Save live-data QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: precision-model-live-qa
          path: |
            data/processed.json
            qa.log
          retention-days: 14
